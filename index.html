<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EEF1F0" />
<title>Ronnie</title>

<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./img/ikona-180.png" />
<link rel="icon" type="image/png" href="./img/ikona-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Ronnie" />

<style>
  html, body { margin: 0; padding: 0; background: #EEF1F0; }
  #root { min-height: 100vh; }
  .boot {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #3E4B47;
    text-align: center; padding: 0 24px; line-height: 1.8;
  }
</style>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
<div id="root"><div class="boot">Wczytywanie…</div></div>

<script>
/* WERSJA — podbij ręcznie po każdej podmianie rejestr.jsx.
   Poprzednio było tu Date.now(), przez co adres różnił się przy każdym
   otwarciu i przeglądarka nigdy nie sięgała do pamięci podręcznej:
   145 kB pobierania i pełna kompilacja za każdym razem, zamiast raz. */
var WERSJA = "v1.32";

fetch("./rejestr.jsx?v=" + WERSJA)
  .then(function (r) {
    if (!r.ok) throw new Error("Nie znaleziono rejestr.jsx");
    return r.text();
  })
  .then(function (kod) {
    var czysty = kod
      .replace(/^\s*import[^\n]*\n/gm, "")
      .replace(/export\s+default\s+function/, "function");

    var out = Babel.transform(czysty, { presets: ["react"] }).code;
    var fabryka = new Function(
      "React", "useState", "useMemo", "useEffect", "useRef",
      out + "\n; return Mockup;"
    );
    var Komponent = fabryka(
      React, React.useState, React.useMemo, React.useEffect, React.useRef
    );
    ReactDOM.createRoot(document.getElementById("root"))
      .render(React.createElement(Komponent));
  })
  .catch(function (e) {
    document.getElementById("root").innerHTML =
      '<div class="boot">Błąd wczytywania.<br>' + e.message +
      "<br>Twoje dane są bezpieczne — siedzą w pamięci przeglądarki, nie w tym pliku.</div>";
    console.error(e);
  });

/* Praca bez sieci. Na siłowni zasięg bywa marny, a plan treningowy
   i obciążenia mają być dostępne zawsze. Kalkulator makro i trener
   wymagają połączenia — reszta nie. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
